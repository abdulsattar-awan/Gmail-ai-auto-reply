name: Gmail AI Agent

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Test mode (email nahi bhejega)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Code download karo
        uses: actions/checkout@v4

      - name: Python install karo
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Packages install karo
        run: pip install -r requirements.txt

      - name: Agent chalao
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: python gmail_agent.py

      - name: Bookings save karo
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f bookings.db
          git diff --staged --quiet || (git commit -m "Update bookings" && git push)